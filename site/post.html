<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yellow! месечна класация — пост</title>
<link href="assets/fonts.css" rel="stylesheet">
<style>
  /* Пост за шофьорите (1080×1350), изчистен вид: топ 3 в една тъмна карта (с наградите за месеца),
     места 4–10 като списък без кутийки. Данни: data/leaderboard.json → monthPost; ?data=… за преглед с други данни. */
  :root { --yellow: #F7E01D; --navy: #0C0F3B; --white: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @page { size: 1080px 1350px; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--yellow); }
  body { font-family: Montserrat, Arial, sans-serif; color: var(--navy); font-feature-settings: "locl" 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .post { width: 1080px; height: 1350px; display: flex; flex-direction: column; padding: 52px 72px 0; }
  .num { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hash { font-size: .6em; vertical-align: .38em; margin-right: .04em; opacity: .55; }

  .top { display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .logo { width: 150px; height: auto; display: block; margin-left: -10px; }
  .pill {
    height: 60px; line-height: 60px; padding: 0 30px; border-radius: 30px;
    background: var(--navy); color: var(--white); font-weight: 800; font-size: 26px; white-space: nowrap;
  }
  .pill b { color: var(--yellow); font-weight: 900; }
  .kicker { margin-top: 20px; font-weight: 800; font-size: 26px; line-height: 32px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  h1 { font-family: Unbounded, Montserrat, sans-serif; font-weight: 900; font-size: 104px; line-height: 1; text-transform: uppercase; white-space: nowrap; margin-top: 2px; }
  h1 small { display: block; font-size: 50px; line-height: 1.1; }

  /* Топ 3: една тъмна карта, под всеки номер — наградата му за месеца */
  .top3 { margin-top: 22px; background: var(--navy); color: var(--white); border-radius: 36px; padding: 8px 36px; }
  .t { display: flex; align-items: center; gap: 24px; height: 116px; border-top: 2px solid rgba(255, 255, 255, .14); }
  .t:first-child { border-top: 0; height: 156px; }
  .t .n {
    flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: Unbounded, Montserrat, sans-serif; font-weight: 900; font-size: 52px; line-height: 1; color: var(--yellow);
  }
  .t:first-child .n { font-size: 76px; }
  .crown { width: 44px; height: 29px; }
  .t .who { flex: 1; min-width: 0; }
  .t .line { display: flex; align-items: center; gap: 16px; }
  .t .car { font-size: 60px; line-height: 1; }
  .t:first-child .car { font-size: 84px; }
  .t .prize { font-weight: 800; font-size: 22px; line-height: 1.2; letter-spacing: .03em; text-transform: uppercase; color: var(--yellow); margin-top: 8px; white-space: nowrap; }
  .t .count { flex: none; text-align: right; font-size: 60px; line-height: 1; }
  .t:first-child .count { font-size: 84px; }
  .t .count small { display: block; font: 700 22px Montserrat, Arial, sans-serif; margin-top: 4px; opacity: .75; }
  .t.empty .car { font-weight: 800; font-size: 34px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }

  /* Движение спрямо миналия понеделник — само когато има движение */
  .move {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 19px;
    font-weight: 900; font-size: 22px; white-space: nowrap;
  }
  .move svg { width: 16px; height: 14px; }
  .top3 .move.up, .top3 .move.new { background: var(--yellow); color: var(--navy); }
  .rows .move.up { background: var(--navy); color: var(--yellow); }
  .rows .move.new { background: var(--white); color: var(--navy); }
  .move.down { opacity: .7; } /* слизането е тихо — без кутийка, но в същата колона */
  .move.new { letter-spacing: .04em; }

  /* Звездата на седмицата — един ред */
  .star { margin-top: 16px; height: 40px; padding: 0 36px; display: flex; align-items: center; gap: 24px; white-space: nowrap; }
  .star svg { flex: none; width: 84px; height: 28px; }
  .star .label { font-weight: 800; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; }
  .star .car { font-size: 32px; line-height: 1; }
  .star .plus { margin-left: auto; background: var(--navy); color: var(--yellow); font-weight: 900; font-size: 24px; border-radius: 20px; padding: 5px 16px; }

  /* Места 4 – 10: списък без кутийки */
  .rows { list-style: none; margin-top: 8px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; align-items: center; gap: 24px; height: 60px; padding: 0 36px; border-top: 2px solid rgba(12, 15, 59, .14); }
  .row:first-child { border-top: 0; }
  .row .rank { flex: none; width: 84px; text-align: center; font-weight: 900; font-size: 28px; }
  .row .car { flex: none; width: 170px; font-size: 40px; line-height: 1; }
  .row .count { margin-left: auto; font-size: 40px; line-height: 1; }
  .row .count small { font: 700 22px Montserrat, Arial, sans-serif; margin-left: 8px; opacity: .75; }
  .rows .more { padding: 14px 8px 0; border-top: 2px solid rgba(12, 15, 59, .14); text-align: center; font-weight: 800; font-size: 26px; line-height: 1.3; }
  .rows .more:first-child { border-top: 0; font-size: 36px; }
  .rows .more:first-child b { font-size: 64px; }
  .rows .more b { display: block; font-family: Unbounded, Montserrat, sans-serif; font-weight: 900; font-size: 44px; line-height: 1.15; text-transform: uppercase; margin-bottom: 8px; }

  footer {
    display: flex; align-items: center; gap: 24px; margin: 0 -72px; padding: 0 72px; height: 104px;
    background: var(--navy); color: var(--white);
  }
  footer .card { height: 68px; width: auto; border: 2px solid var(--white); border-radius: 6px; transform: rotate(-8deg); }
  footer .l1 { font-weight: 900; font-size: 34px; white-space: nowrap; }
  footer .l1 em { font-style: normal; color: var(--yellow); }

  /* Финал на месеца: шампионите, без седмичните движения */
  body.final .kicker, body.final .star, body.final .move { display: none; }
  body.final h1 { margin-top: 18px; }

</style>
</head>
<body>
<div class="post" id="post">
  <div class="top">
    <img class="logo" src="assets/logo.png" alt="Yellow!">
    <div class="pill" id="pill"></div>
  </div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <section class="top3" id="top3"></section>
  <div class="star" id="star"></div>
  <ol class="rows" id="rows"></ol>
  <footer>
    <img class="card" src="assets/sticker.jpg" alt="">
    <div class="l1" id="l1">Всеки отзив в Google = <em>+1 за теб</em></div>
  </footer>
</div>
<script>
  // Наградите за месеца (1-во, 2-ро, 3-то място)
  const PRIZES = ['Супер поръчка + 10 пъти първи в зоната', 'Супер поръчка + 5 пъти първи в зоната', 'Супер поръчка'];
  const MONTHS = ['януари', 'февруари', 'март', 'април', 'май', 'юни', 'юли', 'август', 'септември', 'октомври', 'ноември', 'декември'];
  const params = new URLSearchParams(location.search);
  const N = 10; // колко места показва постът
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const carHtml = car => `<span class="hash">#</span>${esc(String(car).replace(/^#/, ''))}`;
  const reviewsWord = n => (n === 1 ? 'отзив' : 'отзива');
  const day = s => +s.slice(8, 10);
  const UP = '<svg viewBox="0 0 18 16" aria-hidden="true"><path d="M9 0 18 16H0z" fill="currentColor"/></svg>';
  const DOWN = '<svg viewBox="0 0 18 16" aria-hidden="true"><path d="M9 16 18 0H0z" fill="currentColor"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1l3.2 7.1 7.8.8-5.8 5.2 1.7 7.6L12 17.8 5.1 21.7l1.7-7.6L1 8.9l7.8-.8z"/></svg>';
  const CROWN = '<svg class="crown" viewBox="0 0 92 60" aria-hidden="true"><path d="M6 52 2 12l24 18L46 2l20 28 24-18-4 40z" fill="currentColor"/><rect x="6" y="52" width="80" height="8" rx="3" fill="currentColor"/></svg>';

  function render(m) {
    const mi = +m.month.slice(5, 7) - 1;
    const top = m.top || [];
    // Месецът е започнал тази седмица — няма с какво да сравним, затова без движения
    const firstWeek = !m.final && top.every(p => p.prevRank == null);
    document.body.classList.toggle('final', !!m.final);

    // ▲2 / ▼1 / НОВ спрямо миналия понеделник; без значка, когато мястото е същото
    const move = p => {
      if (firstWeek || m.final) return '';
      if (p.prevRank == null) return '<span class="move new">НОВ</span>';
      const d = p.prevRank - p.rank;
      return d > 0 ? `<span class="move up">${UP}${d}</span>` : d < 0 ? `<span class="move down">${DOWN}${-d}</span>` : '';
    };

    // Наградите са месечни: броим дните до тях, а във финала — кой ги спечели
    $('pill').innerHTML = m.final ? `<b>Финал</b> · ${m.total} ${reviewsWord(m.total)}`
      : m.daysLeft === 1 ? '<b>Последен ден</b> до наградите'
      : `Остават <b>${m.daysLeft} дни</b> до наградите`;
    $('kicker').textContent = `Rate and Win · класация към ${day(m.to)}.${String(mi + 1).padStart(2, '0')}`;
    $('title').innerHTML = m.final ? `<small>Шампионите на</small>${MONTHS[mi]}` : MONTHS[mi];
    if (m.final) {
      const next = MONTHS[(mi + 1) % 12];
      $('l1').innerHTML = `${next[0].toUpperCase() + next.slice(1)} започва <em>от 0</em>`;
    }

    $('top3').innerHTML = [0, 1, 2].map(i => {
      const p = top[i];
      return `<div class="t${p ? '' : ' empty'}">
        <div class="n">${i === 0 ? CROWN : ''}${i + 1}</div>
        <div class="who">
          <div class="line">${p ? `<span class="car num">${carHtml(p.car)}</span>${move(p)}`
            : `<span class="car">Свободно</span>${i === top.length ? '<span class="move new">1 отзив и си тук!</span>' : ''}`}</div>
          <div class="prize">${esc(PRIZES[i])}</div>
        </div>
        ${p ? `<div class="count num">${p.reviews}<small>${reviewsWord(p.reviews)}</small></div>` : ''}
      </div>`;
    }).join('');

    // Звездата на седмицата: най-много нови отзиви (при равенство — по-напред в класацията)
    const star = firstWeek ? null : top.filter(p => p.gain > 0).sort((a, b) => b.gain - a.gain || a.rank - b.rank)[0];
    $('star').innerHTML = star
      ? `${STAR}<span class="label">Звездата на седмицата</span><span class="car num">${carHtml(star.car)}</span>
         <span class="plus">+${star.gain} ${reviewsWord(star.gain)}</span>`
      : '';
    if (!star) $('star').style.display = 'none';

    // Местата 4–N: заетите, а ако има свободни — един ред покана
    const filled = top.slice(3, N);
    const free = N - Math.max(3, top.length);
    $('rows').innerHTML = filled.map(p => `<li class="row">
        <span class="rank">${p.rank}</span>
        <span class="car num">${carHtml(p.car)}</span>
        ${move(p)}
        <span class="count num">${p.reviews}<small>${reviewsWord(p.reviews)}</small></span>
      </li>`).join('') + (free > 0 && !m.final
        ? `<li class="more">${filled.length
          ? `Още ${free} ${free === 1 ? 'място' : 'места'} в топ ${N} ${free === 1 ? 'е свободно' : 'са свободни'} — 1 отзив и си вътре`
          : `<b>${free} свободни места</b>в топ ${N} — 1 отзив и си в класацията`}</li>` : '');
  }

  // Шрифтовете се зареждат изрично преди рисуването; страницата е „готова“ само ако нищо не излиза от рамката.
  const src = params.get('data') || 'data/leaderboard.json';
  (async () => {
    const j = await (await fetch(src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' })).json();
    await Promise.all([
      document.fonts.load('900 100px Unbounded', 'НОЕМВРИ 0123 #'),
      document.fonts.load('900 34px Montserrat', 'отзив 0123 #'),
      document.fonts.load('800 24px Montserrat', 'отзива Rate'),
      document.fonts.load('700 22px Montserrat', 'отзива Rate'),
    ]);
    render(j.monthPost || j);
    await document.fonts.ready;
    const ok = document.fonts.check('900 100px Unbounded', 'Н') && document.fonts.check('900 34px Montserrat', 'о');
    const fits = $('post').scrollHeight <= 1350 && [...document.querySelectorAll('.t, .row, .star, .kicker, h1')].every(el => el.scrollWidth <= el.clientWidth + 1);
    document.body.dataset.ready = ok ? (fits ? '1' : 'overflow') : 'fonts-missing';
    document.title = document.body.dataset.ready === '1' ? 'ready' : document.body.dataset.ready;
  })();
</script>
</body>
</html>
