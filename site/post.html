<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yellow! месечна класация — пост</title>
<link href="assets/fonts.css" rel="stylesheet">
<style>
  /* Пост за шофьорите (1080×1350), „F1 timing tower“ в стъкло: тъмна стъклена кула с местата 1–10 върху жълт фон
     с състезателни ленти, светли стъклени чипове и „док“ отдолу. Наградите за месеца стоят при топ 3.
     Данни: data/leaderboard.json → monthPost; ?data=… за преглед с други данни. */
  :root { --yellow: #F7E01D; --navy: #0C0F3B; --white: #FFFFFF; --purple: #A03CF5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @page { size: 1080px 1350px; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--yellow); }
  body { font-family: Montserrat, Arial, sans-serif; color: var(--navy); font-feature-settings: "locl" 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .post { position: relative; width: 1080px; height: 1350px; display: flex; flex-direction: column; padding: 52px 72px 36px; overflow: hidden; isolation: isolate; }
  .num { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hash { font-size: .6em; vertical-align: .38em; margin-right: .04em; opacity: .55; }
  .disp { font-family: Unbounded, Montserrat, sans-serif; font-weight: 900; }

  /* Фон: жълто поле с две състезателни ленти (като ливрея), които стъклото отгоре размива */
  .bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: var(--yellow); }
  .bg i { position: absolute; left: 578px; top: 677px; width: 2400px; height: 80px; margin: -40px 0 0 -1200px; transform: rotate(-51.4deg); background: var(--navy); }
  /* Лентата не минава под кулата: горе спира зад нея, долу излиза изпод нея (иначе стъклото става на две петна) */
  .bg b { position: absolute; left: 0; right: 0; overflow: hidden; }
  .bg b:nth-child(1) { top: 0; height: 312px; }
  .bg b:nth-child(1) i { left: 608px; }
  .bg b:nth-child(1) i + i { height: 16px; margin-top: -74px; }
  .bg b:nth-child(2) { top: 1142px; bottom: 0; }
  .bg b:nth-child(2) i { top: -465px; }

  /* Стъкло: размит фон + светъл ръб отгоре-вляво и долу-вдясно (както при новото стъкло на Apple) */
  .glass { position: relative; }
  .glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: linear-gradient(140deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.3) 22%, rgba(255,255,255,.08) 55%, rgba(255,255,255,.55) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .glass.light { -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.16));
    box-shadow: 0 14px 28px -14px rgba(12,15,59,.4), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -8px 14px -10px rgba(255,255,255,.75); }
  .glass.dark { -webkit-backdrop-filter: blur(36px) brightness(.55) saturate(160%); backdrop-filter: blur(36px) brightness(.55) saturate(160%);
    background: radial-gradient(120% 60% at 0% 0%, rgba(255,255,255,.13), transparent 60%), radial-gradient(90% 40% at 100% 100%, rgba(247,224,29,.12), transparent 60%), linear-gradient(180deg, rgba(12,15,59,.93), rgba(12,15,59,.97));
    box-shadow: 0 0 0 1px rgba(12,15,59,.55), 0 36px 60px -28px rgba(12,15,59,.7), inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.18), inset 0 0 26px rgba(247,224,29,.30); }

  .top { display: flex; align-items: center; justify-content: space-between; height: 80px; }
  /* Логото е на същото място и със същия размер като в постовете от 12 и 16.11 (160px, ляв край 54px, горен край 44px) */
  .logo { align-self: flex-start; width: 160px; height: auto; display: block; margin: -6px 0 0 -18px; }
  .pill.glass.light { background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.12)); box-shadow: 0 10px 24px -10px rgba(12,15,59,.45), inset 0 1.5px 0 #fff, inset 0 -2px 3px rgba(12,15,59,.14); }
  .pill { height: 60px; line-height: 60px; padding: 0 30px; border-radius: 30px; font-weight: 800; font-size: 25px; white-space: nowrap; }
  .pill b { font-weight: 900; }
  h1 { align-self: flex-start; font-family: Unbounded, Montserrat, sans-serif; font-weight: 900; font-size: 104px; line-height: 1; text-transform: uppercase; white-space: nowrap; margin-top: 10px; transform: skewX(-9deg); transform-origin: 0 100%; }
  h1 small { display: block; font-size: 46px; line-height: 1.15; }

  /* Кулата */
  .tower { margin-top: 24px; flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 44px; color: var(--white); padding: 0 30px 10px; }
  .thead { flex: none; height: 62px; display: flex; align-items: center; gap: 18px; padding: 0 6px; font-weight: 800; font-size: 19px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .thead .brand { font-size: 19px; letter-spacing: .04em; color: var(--yellow); transform: skewX(-9deg); }
  .thead .lap { height: 34px; line-height: 34px; padding: 0 14px; border-radius: 8px; background: rgba(255,255,255,.14); letter-spacing: .08em; }
  .thead .lap b { font-weight: 900; color: var(--yellow); }
  .thead .col { margin-left: auto; font-size: 21px; opacity: .75; }

  .r { display: flex; align-items: center; gap: 20px; padding: 0 6px; border-top: 1px solid rgba(255,255,255,.12); white-space: nowrap; }
  .pos { flex: none; width: 64px; height: 44px; border-radius: 9px; transform: skewX(-9deg); display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.2); font-size: 24px; line-height: 1; }
  .pos span { transform: skewX(9deg); }
  .bar { flex: none; width: 4px; align-self: stretch; margin: 14px 0; border-radius: 2px; background: rgba(255,255,255,.18); transform: skewX(-9deg); }
  .r .who { flex: 1; min-width: 0; padding-right: 8px; }
  .r .line { display: flex; align-items: center; gap: 16px; overflow: hidden; }
  .r .line > * { flex: none; }
  .r .count { flex: none; margin-left: auto; text-align: right; }

  /* Топ 3 — с наградата за месеца */
  .t { flex: none; height: 112px; }
  .t .pos { width: 76px; height: 60px; font-size: 34px; background: var(--white); color: var(--navy); }
  .t .bar { width: 6px; border-radius: 3px; background: var(--yellow); }
  .t .car { font-size: 58px; line-height: 1; }
  .t .count { font-size: 58px; line-height: 1; }
  .t .prize { font-weight: 900; font-size: 25px; line-height: 1.2; letter-spacing: .02em; text-transform: uppercase; color: var(--yellow); margin-top: 8px; overflow: hidden; }
  .t.p1 { height: 150px; }
  .t.p1 .pos { height: 84px; font-size: 48px; background: var(--yellow); }
  .t.p1 .car, .t.p1 .count { font-size: 86px; }
  .t.p1 .count { color: var(--yellow); }
  .t.p1.wide .count { font-size: 68px; }

  .t.empty .car { font-weight: 800; font-size: 32px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }

  /* Места 4 – 10 */
  .rows { list-style: none; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .row { flex: 1; max-height: 74px; }
  .row .bar { margin: 16px 0; }
  .row .car { flex: none; width: 150px; font-size: 38px; line-height: 1; }
  .row .count { font-size: 38px; line-height: 1; }
  .row.ghost .pos, .row.ghost .bar { opacity: .6; }
  .row.ghost .car { opacity: .42; }
  .rows .more { flex: none; height: 78px; padding-top: 14px; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid rgba(255,255,255,.12); font-weight: 800; font-size: 26px; white-space: nowrap; }
  .rows .more b { color: var(--yellow); font-weight: 900; }

  /* Движение спрямо миналия понеделник — само когато има движение */
  .move { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 23px; white-space: nowrap; }
  .move svg { width: 15px; height: 13px; }
  .move.up { color: var(--yellow); }
  .move.down { opacity: .7; }
  .move.new { height: 32px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,.16); letter-spacing: .08em; font-size: 18px; }
  .t .move.new { background: var(--yellow); color: var(--navy); }

  /* Звездата на седмицата — като „най-бърза обиколка“ във F1: нищо не стои вътре до номера.
     Целият ред светва в лилаво и излиза отстрани на кулата като флаг с ★ и +N; какво значи лилавото казва чипът в лентата горе. */
  .r { position: relative; }
  /* Лилавото минава НАД ръба на кулата (иначе ръбът прозира като шев): флаг → лилав ред → съдържанието на реда */
  .r.star > :not(.flag) { position: relative; z-index: 3; }
  .r.star::before { content: ''; position: absolute; z-index: 2; left: -22px; right: -30px; top: 7px; bottom: 7px; border-radius: 12px 0 0 12px;
    background: linear-gradient(90deg, rgba(58,30,150,.6) 0%, rgba(118,48,224,.52) 42%, rgba(160,60,245,.9) 82%, var(--purple) 97%); }
  /* Флагът е висок колкото лилавия ред; наклонът на десния му ръб е ~4px при всяка височина */
  .flag { position: absolute; z-index: 1; left: calc(100% + 12px); top: 7px; bottom: 7px; width: 70px; padding-left: 18px; border-radius: 10px; transform: skewX(var(--sk));
    --sk: -2.4deg; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--purple); color: var(--white);
    font-style: normal; font-weight: 900; font-size: 26px; line-height: 1; letter-spacing: -.5px;
    box-shadow: 10px 12px 18px -10px rgba(12,15,59,.6), inset -1.5px 0 0 rgba(255,255,255,.22); }
  .flag > * { transform: skewX(calc(var(--sk) * -1)); }
  .flag svg { width: 22px; height: 22px; }
  /* Двуцифрено +N: същата височина на цифрите, само малко по-тесни */
  .flag.long b { transform: skewX(calc(var(--sk) * -1)) scaleX(.88); letter-spacing: 1.5px; margin-right: -1.5px; }
  .t.p1 .flag { --sk: -1.7deg; }
  .row .flag { --sk: -4.3deg; gap: 5px; font-size: 21.5px; }
  .row .flag svg { width: 16px; height: 16px; }
  .r.star .count, .t.p1.star .count { color: var(--white); }
  .thead .legend { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px 0 10px; border-radius: 8px; background: var(--purple); color: var(--white); font-size: 16px; font-weight: 900; letter-spacing: .05em; }
  .thead .legend svg { width: 17px; height: 17px; }
  [hidden] { display: none !important; }

  /* „Док“ отдолу */
  .dock { flex: none; margin-top: 30px; height: 96px; border-radius: 48px; display: flex; align-items: center; gap: 22px; padding: 0 34px; }
  .dock .card { height: 66px; width: auto; border: 2px solid var(--white); border-radius: 9px; transform: rotate(-7deg); box-shadow: 0 6px 12px -4px rgba(12,15,59,.5); }
  .dock .l1 { font-weight: 900; font-size: 33px; white-space: nowrap; }
  .dock .l1 em { font-style: normal; background: var(--navy); color: var(--yellow); padding: 4px 14px 6px; border-radius: 12px; margin-left: 4px; }

  /* Финал на месеца: шампионите, без седмичните движения */
  body.final .flag, body.final .legend, body.final .move { display: none; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="bg"><b><i></i><i></i></b><b><i></i></b></div>
  <div class="top">
    <img class="logo" src="assets/logo.png" alt="Yellow!">
    <div class="pill glass light" id="pill"></div>
  </div>
  <h1 id="title"></h1>
  <section class="tower glass dark">
    <div class="thead"><span class="brand disp">Rate and Win</span><span class="lap" id="lap"></span><span class="legend" id="legend" hidden></span><span class="col">Отзиви</span></div>
    <div id="top3"></div>
    <ol class="rows" id="rows"></ol>
  </section>
  <footer class="dock glass light">
    <img class="card" src="assets/sticker.jpg" alt="">
    <div class="l1" id="l1">Всеки отзив в Google = <em>+1 за теб</em></div>
  </footer>
</div>
<script>
  // Наградите за месеца (1-во, 2-ро, 3-то място)
  // Кратко: шофьорите знаят, че „първи“ значи първи в зоната (пълният текст е на плаката с наградите)
  const PRIZES = ['Супер поръчка + 10× първи', 'Супер поръчка + 5× първи', 'Супер поръчка'];
  const MONTHS = ['януари', 'февруари', 'март', 'април', 'май', 'юни', 'юли', 'август', 'септември', 'октомври', 'ноември', 'декември'];
  const params = new URLSearchParams(location.search);
  const N = 10; // колко места показва постът
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const carHtml = car => `<span class="hash">#</span>${esc(String(car).replace(/^#/, ''))}`;
  const reviewsWord = n => (n === 1 ? 'отзив' : 'отзива');
  const day = s => +s.slice(8, 10);
  const UP = '<svg viewBox="0 0 18 16" aria-hidden="true"><path d="M9 0 18 16H0z" fill="currentColor"/></svg>';
  const DOWN = '<svg viewBox="0 0 18 16" aria-hidden="true"><path d="M9 16 18 0H0z" fill="currentColor"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1l3.2 7.1 7.8.8-5.8 5.2 1.7 7.6L12 17.8 5.1 21.7l1.7-7.6L1 8.9l7.8-.8z"/></svg>';
  const CROWN = '<svg class="crown" viewBox="0 0 92 60" aria-hidden="true"><path d="M6 52 2 12l24 18L46 2l20 28 24-18-4 40z" fill="currentColor"/><rect x="6" y="52" width="80" height="8" rx="3" fill="currentColor"/></svg>';

  function render(m) {
    const mi = +m.month.slice(5, 7) - 1;
    const top = m.top || [];
    // Месецът е започнал тази седмица — няма с какво да сравним, затова без движения
    const firstWeek = !m.final && top.every(p => p.prevRank == null);
    document.body.classList.toggle('final', !!m.final);

    // ▲2 / ▼1 / НОВ спрямо миналия понеделник; без значка, когато мястото е същото
    // Звездата на седмицата: най-много нови отзиви (при равенство — по-напред в класацията)
    const star = firstWeek || m.final ? null : top.filter(p => p.gain > 0).sort((a, b) => b.gain - a.gain || a.rank - b.rank)[0];
    // Когато повечето са нови, „НОВ“ остава само при топ 3 (иначе е шум); при звездата на седмицата стои само нейният етикет
    const manyNew = top.slice(0, N).filter(p => p.prevRank == null).length > Math.min(top.length, N) / 2;
    const move = p => {
      if (firstWeek || m.final || p === star) return '';
      if (p.prevRank == null) return manyNew && p.rank > 3 ? '' : '<span class="move new">НОВ</span>';
      const d = p.prevRank - p.rank;
      return d > 0 ? `<span class="move up">${UP}${d}</span>` : d < 0 ? `<span class="move down">${DOWN}${-d}</span>` : '';
    };

    // Наградите са месечни: броим дните до тях, а във финала — кой ги спечели
    $('pill').innerHTML = m.final ? `<b>Финал</b> · ${m.total} ${reviewsWord(m.total)}`
      : m.daysLeft === 1 ? '<b>Последен ден</b> до наградите'
      : `Остават <b>${m.daysLeft} дни</b> до наградите`;
    // „Обиколките“ на месеца: ден X от N (като LAP 15/58)
    const dim = new Date(+m.month.slice(0, 4), mi + 1, 0).getDate();
    $('lap').innerHTML = m.final ? '<b>Финал</b>' : `Ден <b>${day(m.to)}</b>/${dim}`;
    $('title').innerHTML = m.final ? `<small>Шампионите на</small>${MONTHS[mi]}` : MONTHS[mi];
    if (m.final) {
      const next = MONTHS[(mi + 1) % 12];
      $('l1').innerHTML = `${next[0].toUpperCase() + next.slice(1)} започва <em>от 0</em>`;
    }

    // Звездата на седмицата: лилав ред + флаг отстрани на кулата (★ и +N); надписът е в лентата горе
    const flag = p => (p === star ? `<i class="flag${p.gain > 9 ? ' long' : ''}">${STAR}<b>+${p.gain}</b></i>` : '');
    $('legend').hidden = !star;
    $('legend').innerHTML = `${STAR}Звезда на седмицата`;
    const pos = n => `<div class="pos disp"><span>${n}</span></div><i class="bar"></i>`;

    $('top3').innerHTML = [0, 1, 2].map(i => {
      const p = top[i];
      return `<div class="r t${i === 0 ? ' p1' : ''}${p && p.reviews > 99 ? ' wide' : ''}${p ? '' : ' empty'}${p && p === star ? ' star' : ''}">
        ${pos(i + 1)}
        <div class="who">
          <div class="line">${p ? `<span class="car num">${carHtml(p.car)}</span>${move(p)}`
            : `<span class="car">Свободно</span>${i === top.length ? '<span class="move new">1 отзив и си тук!</span>' : ''}`}</div>
          <div class="prize">${esc(PRIZES[i])}</div>
        </div>
        ${p ? `<div class="count num">${p.reviews}</div>${flag(p)}` : ''}
      </div>`;
    }).join('');

    // Местата 4–N: заетите, а ако има свободни — един ред покана
    const filled = top.slice(3, N);
    const free = N - Math.max(3, top.length);
    $('rows').innerHTML = filled.map(p => `<li class="r row${p === star ? ' star' : ''}">
        ${pos(p.rank)}
        <div class="who"><div class="line"><span class="car num">${carHtml(p.car)}</span>${move(p)}</div></div>
        <span class="count num">${p.reviews}</span>${flag(p)}
      </li>`).join('') + (free > 0 && !m.final
        ? Array.from({ length: free }, (_, i) => `<li class="r row ghost">${pos(N - free + i + 1)}<span class="car num">—</span></li>`).join('')
          + `<li class="more"><b>${free} ${free === 1 ? 'свободно място' : 'свободни места'}</b> в топ ${N} — 1 отзив и си вътре</li>` : '');
  }

  // Шрифтовете се зареждат изрично преди рисуването; страницата е „готова“ само ако нищо не излиза от рамката.
  const src = params.get('data') || 'data/leaderboard.json';
  (async () => {
    const j = await (await fetch(src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' })).json();
    await Promise.all([
      document.fonts.load('900 100px Unbounded', 'НОЕМВРИ 0123 #'),
      document.fonts.load('900 34px Montserrat', 'отзив 0123 #'),
      document.fonts.load('800 24px Montserrat', 'отзива Rate'),
      document.fonts.load('700 22px Montserrat', 'отзива Rate'),
    ]);
    render(j.monthPost || j);
    // Дългите месеци (септември) се смаляват, докато влязат до лентата вдясно
    for (const h = $('title'); h.scrollWidth > 760 && parseFloat(getComputedStyle(h).fontSize) > 60;) h.style.fontSize = parseFloat(getComputedStyle(h).fontSize) - 2 + 'px';
    await document.fonts.ready;
    const ok = document.fonts.check('900 100px Unbounded', 'Н') && document.fonts.check('900 34px Montserrat', 'о');
    const fits = $('post').scrollHeight <= 1350 && document.querySelector('.tower').scrollHeight <= document.querySelector('.tower').clientHeight + 1 && [...document.querySelectorAll('.r:not(.star), .r .who, .r .line, .prize, .thead, .dock')].every(el => el.scrollWidth <= el.clientWidth + 1)
      && [...document.querySelectorAll('.flag')].every(f => f.getBoundingClientRect().right <= 1066);
    document.body.dataset.ready = ok ? (fits ? '1' : 'overflow') : 'fonts-missing';
    document.title = document.body.dataset.ready === '1' ? 'ready' : document.body.dataset.ready;
  })();
</script>
</body>
</html>
